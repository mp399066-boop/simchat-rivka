# Manual check of the LIVE site from outside the office network (which goes
# through NetFree and can't reach new sites): gh workflow run smoke.yml
name: Live site check

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site address
        default: https://simchat-rivka-fawn.vercel.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: ${{ inputs.url }}
    steps:
      - name: Signed-out pages redirect to login; API answers 401
        run: |
          fail=0
          check() {  # path, expected status, expected redirect (substring, optional)
            read -r code loc < <(curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' "$URL$1")
            if [ "$code" = "$2" ] && [[ "$loc" == *"$3"* ]]; then echo "✓ $1 → $code $loc"
            else echo "✗ $1 → $code $loc (expected $2 $3)"; fail=1; fi
          }
          check /                     307 /login
          check /users                307 "/login?next=%2Fusers"
          check /login                200
          check /api/me               401
          check /api/admin/users      401
          check /auth/callback        307 "error=missing_code"
          check "/auth/callback?code=x" 307 "error=auth_callback_failed"
          check /mothers              307 "/login?next=%2Fmothers"
          check /menu                 307 "/login?next=%2Fmenu"
          check /icon.png             200
          exit $fail

      - name: Login page is the app, connected to Supabase
        run: |
          html=$(curl -s "$URL/login")
          grep -q 'dir="rtl"' <<<"$html" && echo "✓ Hebrew RTL page" || { echo "✗ not the app"; exit 1; }
          for f in $(grep -o '/_next/static/[^"]*\.js' <<<"$html" | sort -u); do
            if curl -s "$URL$f" | grep -q '\.supabase\.co'; then echo "✓ Supabase address is built in"; exit 0; fi
          done
          echo "✗ Supabase address missing from the build (check Vercel env vars)"; exit 1
